<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111f"><animate attributeName="stop-color" values="#07111f;#0b1530;#07111f" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="55%" stop-color="#0d1830"><animate attributeName="stop-color" values="#0d1830;#111b39;#0d1830" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#07111f"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#fb7185"/>
    <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="orb"><stop offset="0" stop-color="#67e8f9" stop-opacity=".95"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs><rect width="1200" height="270" rx="28" fill="url(#bg)"/>
<text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="900">Q1 · DICTIONARY OPERATIONS</text><text x="600" y="86" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="3">SIX REPRESENTATIONS · SEVEN OPERATIONS</text>
<g transform="translate(600 176)" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><circle r="54" fill="#0f1d30" stroke="url(#neon)" stroke-width="2"><animate attributeName="r" values="50;57;50" dur="3s" repeatCount="indefinite"/></circle><text y="-3" fill="#f8fafc" font-size="17" font-weight="800">DICTIONARY</text><text y="20" fill="#94a3b8" font-size="14">ADT</text></g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#e2e8f0"><g transform="translate(175 150)"><circle r="30" fill="#0f1d30" stroke="#22d3ee" stroke-width="1.6"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="2.1s" repeatCount="indefinite"/></circle><text y="4">U-Array</text><path d="M0 0 L425 26" stroke="#22d3ee" stroke-opacity=".25"/></g><g transform="translate(280 225)"><circle r="30" fill="#0f1d30" stroke="#a78bfa" stroke-width="1.6"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="2.37s" repeatCount="indefinite"/></circle><text y="4">S-Array</text><path d="M0 0 L320 -49" stroke="#a78bfa" stroke-opacity=".25"/></g><g transform="translate(440 122)"><circle r="30" fill="#0f1d30" stroke="#34d399" stroke-width="1.6"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="2.64s" repeatCount="indefinite"/></circle><text y="4">SLL-U</text><path d="M0 0 L160 54" stroke="#34d399" stroke-opacity=".25"/></g><g transform="translate(760 122)"><circle r="30" fill="#0f1d30" stroke="#fbbf24" stroke-width="1.6"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="2.91s" repeatCount="indefinite"/></circle><text y="4">SLL-S</text><path d="M0 0 L-160 54" stroke="#fbbf24" stroke-opacity=".25"/></g><g transform="translate(920 225)"><circle r="30" fill="#0f1d30" stroke="#fb7185" stroke-width="1.6"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3.18s" repeatCount="indefinite"/></circle><text y="4">DLL-U</text><path d="M0 0 L-320 -49" stroke="#fb7185" stroke-opacity=".25"/></g><g transform="translate(1025 150)"><circle r="30" fill="#0f1d30" stroke="#38bdf8" stroke-width="1.6"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3.45s" repeatCount="indefinite"/></circle><text y="4">DLL-S</text><path d="M0 0 L-425 26" stroke="#38bdf8" stroke-opacity=".25"/></g></g></svg>