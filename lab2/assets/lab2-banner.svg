<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111f"><animate attributeName="stop-color" values="#07111f;#0b1530;#07111f" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="55%" stop-color="#0d1830"><animate attributeName="stop-color" values="#0d1830;#111b39;#0d1830" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#07111f"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#fb7185"/>
    <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="orb"><stop offset="0" stop-color="#67e8f9" stop-opacity=".95"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs><rect width="1400" height="350" rx="32" fill="url(#bg)"/>
<g opacity=".4" fill="none" stroke-width="2"><circle cx="210" cy="176" r="115" stroke="#22d3ee"><animate attributeName="r" values="90;125;90" dur="5s" repeatCount="indefinite"/></circle><circle cx="1190" cy="176" r="115" stroke="#fb7185"><animate attributeName="r" values="125;90;125" dur="6s" repeatCount="indefinite"/></circle></g>
<text x="700" y="104" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-weight="900" font-size="52">LAB 02</text><text x="700" y="148" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="4">DICTIONARIES · MERGE SORT · MULTIWAY MERGING</text>
<path id="l2" d="M210 238 C400 290 495 212 700 238 S1010 286 1190 216" fill="none" stroke="url(#neon)" stroke-width="4" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" from="0" to="-88" dur="3s" repeatCount="indefinite"/></path>
<g filter="url(#glow)"><circle r="7" fill="#67e8f9"><animateMotion dur="4.4s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle><circle r="6" fill="#fda4af"><animateMotion dur="4.4s" begin="-2.2s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle></g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" font-weight="800"><text x="210" y="318" fill="#67e8f9" font-size="17">Q1 · O(1) / O(log n) / O(n)</text><text x="700" y="318" fill="#c4b5fd" font-size="17">Q2 · Θ(n log n)</text><text x="1190" y="318" fill="#fda4af" font-size="17">Q3 · Θ(nk²) vs Θ(nk log k)</text></g></svg>