<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='700'><defs><linearGradient id='b' x1='0' y1='0' x2='1' y2='1'><stop stop-color='#1e1b4b'/><stop offset='1' stop-color='#020617'/></linearGradient></defs><rect width='1200' height='700' rx='24' fill='url(#b)'/><text x='600' y='58' fill='white' font-family='Arial' font-size='30' font-weight='700' text-anchor='middle'>Strassen: 7 Recursive Products instead of 8</text><text x='600' y='90' fill='#c7d2fe' font-family='Arial' font-size='16' text-anchor='middle'>Scalar multiplication growth on log scale</text><line x1='100' y1='610' x2='1100' y2='610' stroke='#64748b' stroke-width='2'/><line x1='100' y1='150' x2='100' y2='610' stroke='#64748b' stroke-width='2'/><polyline fill='none' stroke='#22d3ee' stroke-width='5' points='100.00,610.00 200.00,566.95 300.00,523.91 400.00,480.86 500.00,437.82 600.00,394.77 700.00,351.72 800.00,308.68 900.00,265.63 1000.00,222.59 1100.00,179.54 '/><polyline fill='none' stroke='#f97316' stroke-width='5' points='100.00,610.00 200.00,564.00 300.00,518.00 400.00,472.00 500.00,426.00 600.00,380.00 700.00,334.00 800.00,288.00 900.00,242.00 1000.00,196.00 1100.00,150.00 '/><rect x='740' y='112' width='345' height='82' rx='14' fill='#0f172a' stroke='#475569'/><line x1='765' y1='140' x2='820' y2='140' stroke='#22d3ee' stroke-width='5'/><text x='835' y='146' fill='white' font-family='Arial' font-size='15'>Strassen n^2.8074</text><line x1='765' y1='169' x2='820' y2='169' stroke='#f97316' stroke-width='5'/><text x='835' y='175' fill='white' font-family='Arial' font-size='15'>Classical n^3</text><text x='600' y='660' fill='#c7d2fe' font-family='Arial' font-size='16' text-anchor='middle'>Replacing 8 half-size products by 7 lowers the exponent from 3 to log2(7) ~= 2.8074.</text></svg>