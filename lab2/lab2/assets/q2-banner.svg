<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111f"><animate attributeName="stop-color" values="#07111f;#0b1530;#07111f" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="55%" stop-color="#0d1830"><animate attributeName="stop-color" values="#0d1830;#111b39;#0d1830" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#07111f"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#fb7185"/>
    <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="orb"><stop offset="0" stop-color="#67e8f9" stop-opacity=".95"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs><rect width="1200" height="270" rx="28" fill="url(#bg)"/><text x="600" y="55" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="900">Q2 · 2-WAY vs 3-WAY MERGE SORT</text><text x="600" y="86" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="3">SAME ASYMPTOTIC CLASS · DIFFERENT RECURSION SHAPE</text>
<g stroke-linecap="round" fill="none"><path id="two" d="M380 125 L295 205 M380 125 L465 205" stroke="#22d3ee" stroke-width="3"/><path id="three" d="M820 125 L710 205 M820 125 L820 205 M820 125 L930 205" stroke="#a78bfa" stroke-width="3"/></g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><circle cx="380" cy="125" r="30" fill="#0f1d30" stroke="#22d3ee" stroke-width="2"/><text x="380" y="131" fill="#67e8f9" font-size="16" font-weight="800">2</text><circle cx="820" cy="125" r="30" fill="#0f1d30" stroke="#a78bfa" stroke-width="2"/><text x="820" y="131" fill="#c4b5fd" font-size="16" font-weight="800">3</text><text x="380" y="246" fill="#67e8f9" font-size="15" font-weight="800">2T(n/2) + Θ(n)</text><text x="820" y="246" fill="#c4b5fd" font-size="15" font-weight="800">3T(n/3) + Θ(n)</text><text x="600" y="171" fill="#f8fafc" font-size="22" font-weight="900">⇒ Θ(n log n) ⇐</text></g>
