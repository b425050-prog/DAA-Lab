  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs><rect width="1200" height="270" rx="28" fill="url(#bg)"/><text x="600" y="54" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="900">Q3 · MERGING k SORTED ARRAYS</text><text x="600" y="86" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="3">SEQUENTIAL CHAIN vs BALANCED MERGE TREE</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle"><text x="300" y="118" fill="#fda4af" font-weight="800">SEQUENTIAL · Θ(nk²)</text><text x="900" y="118" fill="#67e8f9" font-weight="800">BALANCED · Θ(nk log k)</text></g>
