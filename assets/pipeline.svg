<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="190" viewBox="0 0 1400 190">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#07111f"><animate attributeName="stop-color" values="#07111f;#0b1530;#07111f" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="55%" stop-color="#0d1830"><animate attributeName="stop-color" values="#0d1830;#111b39;#0d1830" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#07111f"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#fb7185"/>
    <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="orb"><stop offset="0" stop-color="#67e8f9" stop-opacity=".95"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1400" height="190" rx="28" fill="url(#bg)"/>
<path id="pipe" d="M135 96 H1265" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M135 96 H1265" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="14 16"><animate attributeName="stroke-dashoffset" from="0" to="-120" dur="3.8s" repeatCount="indefinite"/></path>
<circle r="9" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#pipe"/></animateMotion></circle>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" font-weight="800">
<g transform="translate(135 96)"><circle r="42" fill="#0f1d30" stroke="#22d3ee" stroke-width="2"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="2.1s" repeatCount="indefinite"/></circle><text y="6" fill="#f8fafc" font-size="16">SOLVE</text></g><g transform="translate(417 96)"><circle r="42" fill="#0f1d30" stroke="#34d399" stroke-width="2"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="2.43s" repeatCount="indefinite"/></circle><text y="6" fill="#f8fafc" font-size="16">VERIFY</text></g><g transform="translate(700 96)"><circle r="42" fill="#0f1d30" stroke="#fbbf24" stroke-width="2"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="2.7600000000000002s" repeatCount="indefinite"/></circle><text y="6" fill="#f8fafc" font-size="16">MEASURE</text></g><g transform="translate(983 96)"><circle r="42" fill="#0f1d30" stroke="#a78bfa" stroke-width="2"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="3.09s" repeatCount="indefinite"/></circle><text y="6" fill="#f8fafc" font-size="16">PLOT</text></g><g transform="translate(1265 96)"><circle r="42" fill="#0f1d30" stroke="#fb7185" stroke-width="2"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="3.42s" repeatCount="indefinite"/></circle><text y="6" fill="#f8fafc" font-size="16">EXPLAIN</text></g></g>
</svg>