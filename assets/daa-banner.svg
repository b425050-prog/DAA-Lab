  <circle r="6" fill="#c4b5fd"><animateMotion dur="4.5s" begin="-1.5s" repeatCount="indefinite"><mpath href="#curve"/></animateMotion></circle>
  <circle r="5" fill="#fda4af"><animateMotion dur="4.5s" begin="-3s" repeatCount="indefinite"><mpath href="#curve"/></animateMotion></circle>
</g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
