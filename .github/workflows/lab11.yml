name: Lab 11 C17 verification
on:
  push:
    paths: ['lab11/**', '.github/workflows/lab11.yml']
  pull_request:
    paths: ['lab11/**', '.github/workflows/lab11.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python lab11/tools/build.py
      - run: python lab11/tools/validate.py
      - run: python lab11/tools/generate_evidence.py
